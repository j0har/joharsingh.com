<!-- begin footer -->
<footer class="footer">

  <div class="container">
    <div class="row">
      <div class="col col-12">

        <div class="footer__inner">
          <div class="row">
            {% include footer-widgets/widget-info.html %}
            {% if site.posts.size > 0 %}{% include footer-widgets/widget-recent-posts.html %}{% endif %}
            {% include footer-widgets/widget-navigation.html %}
          </div>
        </div>

        <div class="footer__info">
          <div class="copyright">{{site.time | date: '%Y'}} &copy; <a href="{{ '/' | relative_url }}">{{site.data.settings.title}}</a> <span class="footer-divider" aria-hidden="true"><svg width="8" height="8" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><rect x="1.2" y="1.2" width="5.6" height="5.6" fill="#B8722A" transform="rotate(45 4 4)"></rect></svg></span> Icons by <a href="https://streamlinehq.com" target="_blank" rel="noopener">Streamline</a></div>
          <div class="footer__info__right">
            <div class="top" title="Top"><i class="fa-solid fa-arrow-up"></i> <span class="top__text">Back to top</span></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</footer>
<!-- end footer -->
