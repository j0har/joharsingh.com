{% assign newsletter = site.data.settings.newsletter_settings %}
{% if newsletter.enable == true %}
<!-- begin subscribe -->
<section class="subscribe animate" aria-labelledby="subscribe-title">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="subscribe__inner">
          <div class="subscribe__head">
            <h2 class="subscribe__title" id="subscribe-title">Subscribe to <cite class="subscribe__name">{{ newsletter.newsletter_title }}</cite></h2>
            {% if newsletter.newsletter_description %}
            <p class="subscribe__intro">{{ newsletter.newsletter_description }}</p>
            {% endif %}
          </div>
          <form class="subscribe-form" action="{% if newsletter.newsletter_action %}{{ newsletter.newsletter_action }}{% else %}#{% endif %}" method="POST" id="membedded-subscribe-form" name="membedded-subscribe-form" target="_blank" novalidate>
            <label class="subscribe-form__label" for="form-subscribe-email">Email address</label>
            <div class="subscribe-form__row">
              <input class="subscribe-email" id="form-subscribe-email" type="email" name="email_address" autocomplete="email" required>
              <button class="button button--inverse subscribe-button" id="membedded-subscribe" type="submit" name="subscribe">Sign me up <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- end subscribe -->
{% endif %}
