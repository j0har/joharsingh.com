{% if paginator.total_pages > 1 %}
<!-- begin pagination -->
<div class="container">
  <div class="pagination" data-next-page="{{ paginator.next_page }}" data-total-pages="{{ paginator.total_pages }}" data-total-posts="{{ paginator.total_posts }}" data-page-url="{{ site.baseurl }}{{ site.paginate_path }}/">
    <p class="pagination__status" role="status">Showing {{ paginator.posts | size }} of {{ paginator.total_posts }} posts</p>
    <button class="load-more-posts button button--secondary" type="button">Load more posts</button>
  </div>
</div>
<!-- end pagination -->
{% endif %}
