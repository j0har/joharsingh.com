{% if site.tags.size >= 1 %}
<!-- begin section-tags -->
<section class="section section-tags animate">
  <div class="container">
    <div class="row">
      <div class="col col-12">

        {% if site.data.settings.section_tags_title %}
        <div class="section__info">
          <div class="section__head">
            <h2 class="section__title">{{ site.data.settings.section_tags_title }}</h2>
          </div>
        </div>
        {% endif %}

        {% include tag-index.html %}

      </div>
    </div>
  </div>
</section>
<!-- end section-tags -->
{% endif %}
