<!-- begin projects -->
<section class="section projects animate">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="container__inner">

          {% if site.data.settings.section_projects_title %}
          <div class="section__info">
            <div class="section__head">
              <h2 class="section__title">{{ site.data.settings.section_projects_title }}</h2>
              <a class="section__link" href="{{ '/portfolio' | relative_url }}">View all</a>
            </div>
          </div>
          {% endif %}

          <div class="row">
            {% assign sorted = site.projects | sort: 'date' | reverse %}
            {% for project in sorted limit:6 %}
            {% include project-card.html %}
            {% endfor %}
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
<!-- end projects -->
