{% if page.previous.url or page.next.url %}
<nav class="post-nav" aria-label="Previous and next posts">
  {% if page.previous.url %}
  <div class="post-nav__prev">
    <span class="card-meta">Previous post</span>
    <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a>
  </div>
  {% endif %}
  {% if page.next.url %}
  <div class="post-nav__next">
    <span class="card-meta">Next post</span>
    <a href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a>
  </div>
  {% endif %}
</nav>
{% endif %}
